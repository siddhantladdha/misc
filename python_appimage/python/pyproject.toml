# Kept in sync with the pi appimage build manifest as a record of what the
# scripts here may assume is available. The appimage already bundles all of
# these and exposes them through the venv via system site-packages, so do NOT
# `uv sync` casually -- it would re-download everything from PyPI into .venv.
# Use `uv run --no-sync` (or UV_NO_SYNC=1) to run without triggering that.
[tool.uv]
# This is added to coerce the use of system python which here refers to the appimage python.
python-preference = "only-system"
python-downloads = "never"
package = false
offline = true
upgrade = false
